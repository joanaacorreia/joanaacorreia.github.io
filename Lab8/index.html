<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Online</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Loja</h1>

      <nav>
        <ul>
          <li><a href="#produtos">Produtos</a></li>
          <li><a href="#cesto">Cesto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="produtos">
        <h2>Os nossos produtos</h2>

        <label for="categoria">Filtrar</label>
        <select id="categoria">
          <option value="todos">Todas as categorias</option>
          <option value="tshirts">T-shirts</option>
          <option value="canecas">Canecas</option>
          <option value="meias">Meias</option>
        </select>

        <label for="preco">Ordenar</label>
        <select id="preco">
          <option value="ordenar">Ordenar pelo preço</option>
          <option value="decrescente">Preço decrescente</option>
          <option value="crescente">Preço crescente</option>
        </select>

        <label for="pesquisa">Procurar</label>
        <input type="text" id="pesquisa" placeholder="Pesquise por produto" />

        <div id="lista-produtos"></div>
      </section>

      <section id="cesto">
        <h2>O meu cesto</h2>
        <p>Os produtos que escolheste aparecem aqui.</p>

        <div id="lista-cesto"></div>

        <h3>Total: <span id="total">0,00 €</span></h3>
      </section>
    </main>

    <footer>
      <p>2026 | ULusófona</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
